name: Dynamic Island Build

# ColorOS/OxygenOS/realme UI only surface a media session in their Dynamic Island
# (Aqua Dynamics / Live Capsule) when the session's package is on an OEM
# allowlist. Editing that list needs root, so this workflow rebuilds Metrolist
# under an allowlisted application id instead. It cannot be installed next to the
# real app it borrows the id from.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Application id to build under (must be on your OEM allowlist)"
        required: false
        default: com.spotify.music
      appName:
        description: "Label shown under the launcher icon"
        required: false
        default: Metrolist
      variant:
        description: "Flavour"
        required: false
        default: foss
      buildType:
        description: "Build type"
        required: false
        default: release
  push:
    branches: ["main"]
    paths:
      - "app/build.gradle.kts"
      - ".github/workflows/dynamic_island.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_dynamic_island:
    name: Dynamic Island APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore persistent debug keystore
        id: ks_cache
        uses: actions/cache/restore@v6
        with:
          path: app/persistent-debug.keystore
          key: dynamic-island-debug-keystore-v1

      # The keystore has to survive across runs. Android refuses to update an
      # installed package in place when the signature changes, so a throwaway key
      # per run would force a full uninstall (and re-login) on every rebuild.
      - name: Detect signing secrets
        id: signing
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KS_FROM_CACHE: ${{ steps.ks_cache.outputs.cache-hit }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            printf '%s' "$DEBUG_KEYSTORE" | base64 -d > ./app/persistent-debug.keystore
            echo "debug_keystore=restored" >> "$GITHUB_OUTPUT"
          elif [ "$KS_FROM_CACHE" = "true" ]; then
            echo "debug_keystore=restored" >> "$GITHUB_OUTPUT"
          else
            # Decoding an empty secret leaves a zero byte keystore that exists
            # but cannot sign, so mint a persistent one instead.
            keytool -genkeypair -v \
              -keystore ./app/persistent-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Metrolist Dynamic Island,O=Metrolist,C=US"
            echo "debug_keystore=generated" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$KEYSTORE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release signing secret configured, release builds stay unsigned."
          fi

      - name: Save persistent debug keystore
        if: steps.signing.outputs.debug_keystore == 'generated'
        uses: actions/cache/save@v6
        with:
          path: app/persistent-debug.keystore
          key: dynamic-island-debug-keystore-v1

      - name: Build APK
        env:
          PKG: ${{ github.event.inputs.package || 'com.spotify.music' }}
          APP_NAME: ${{ github.event.inputs.appName || 'Metrolist' }}
          VARIANT: ${{ github.event.inputs.variant || 'foss' }}
          BUILD_TYPE: ${{ github.event.inputs.buildType || 'debug' }}
          METROLIST_APP_NAME: ${{ github.event.inputs.appName || 'Metrolist' }}
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "false"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PKG" | grep -Eq '^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$'; then
            echo "::error::'$PKG' is not a valid Android application id"
            exit 1
          fi
          case "$VARIANT" in
            foss) TASK=assembleFoss ;;
            gms)  TASK=assembleGms ;;
            izzy) TASK=assembleIzzy ;;
            *) echo "::error::unknown variant '$VARIANT'"; exit 1 ;;
          esac
          case "$BUILD_TYPE" in
            release) TASK="${TASK}Release" ;;
            *)       TASK="${TASK}Debug" ;;
          esac
          echo "Building $TASK as $PKG"
          ./gradlew --console=plain "$TASK" -PdynamicIslandPackage="$PKG" --warning-mode summary

      # Debug builds of this app are noticeably slower at runtime because R8 and the Compose
      # production compiler do not run. Sign the release build with the same persistent keystore so
      # it stays installable and updatable in place without needing upstream release secrets.
      - name: Sign release APK
        if: github.event.inputs.buildType == 'release'
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER=$(find "$SDK/build-tools" -mindepth 2 -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK/build-tools"
            exit 1
          fi
          VARIANT_DIR="app/build/outputs/apk/${{ github.event.inputs.variant || 'foss' }}/release"
          UNSIGNED=$(find "$VARIANT_DIR" -maxdepth 1 -name '*.apk' ! -name '*-signed.apk' | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No unsigned release APK found in $VARIANT_DIR"
            exit 1
          fi
          mkdir -p "$VARIANT_DIR/out"
          "$APKSIGNER" sign \
            --ks app/persistent-debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$VARIANT_DIR/out/app-signed.apk" \
            "$UNSIGNED"
          "$APKSIGNER" verify "$VARIANT_DIR/out/app-signed.apk"
          # Drop the unsigned copy so the artifact only ever contains the installable APK.
          rm -f "$UNSIGNED"
          echo "Signed release APK is ready."

      # A green build proves nothing about the application id, so assert the
      # spoof actually landed before publishing the artifact.
      - name: Verify application id
        env:
          PKG: ${{ github.event.inputs.package || 'com.spotify.music' }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT=$(find "$SDK/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 2>/dev/null | sort -V | tail -1)
          APK=$(find app/build/outputs/apk -name '*.apk' -path '*/out/*' | head -1)
          [ -n "$APK" ] || APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$AAPT" ] || [ -z "$APK" ]; then
            echo "::warning::Could not locate aapt2 or the built APK, skipping verification."
            exit 0
          fi
          ACTUAL=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "Built application id: $ACTUAL"
          if [ "$ACTUAL" != "$PKG" ]; then
            echo "::error::Expected application id '$PKG' but the APK is '$ACTUAL'"
            exit 1
          fi
          echo "Application id spoof verified."

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: metrolist-dynamic-island-${{ github.event.inputs.variant || 'foss' }}-${{ github.event.inputs.buildType || 'debug' }}
          path: app/build/outputs/apk/*/*/*.apk
          if-no-files-found: error