name: Dynamic Island Build

# ColorOS/OxygenOS/realme UI only surface a media session in their Dynamic Island
# (Aqua Dynamics / Live Capsule) when the session's package is on an OEM
# allowlist. Editing that list needs root, so this workflow rebuilds Metrolist
# under an allowlisted application id instead. It cannot be installed next to the
# real app it borrows the id from.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Application id to build under (must be on your OEM allowlist)"
        required: false
        default: com.spotify.music
      appName:
        description: "Label shown under the launcher icon"
        required: false
        default: Metrolist
      variant:
        description: "Flavour"
        required: false
        default: foss
      buildType:
        description: "Build type (release needs signing secrets to be installable)"
        required: false
        default: debug
  push:
    branches: ["main"]
    paths:
      - "app/build.gradle.kts"
      - ".github/workflows/dynamic_island.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_dynamic_island:
    name: Dynamic Island APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug keystore
        if: ${{ secrets.DEBUG_KEYSTORE != '' }}
        run: echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > ./app/persistent-debug.keystore

      - name: Generate debug keystore
        if: ${{ secrets.DEBUG_KEYSTORE == '' }}
        run: |
          keytool -genkeypair -v \
            -keystore ./app/persistent-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Metrolist Dynamic Island,O=Metrolist,C=US"

      - name: Build APK
        env:
          PKG: ${{ github.event.inputs.package || 'com.spotify.music' }}
          APP_NAME: ${{ github.event.inputs.appName || 'Metrolist' }}
          VARIANT: ${{ github.event.inputs.variant || 'foss' }}
          BUILD_TYPE: ${{ github.event.inputs.buildType || 'debug' }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PKG" | grep -Eq '^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$'; then
            echo "::error::'$PKG' is not a valid Android application id"
            exit 1
          fi
          case "$VARIANT" in
            foss) TASK=assembleFoss ;;
            gms)  TASK=assembleGms ;;
            izzy) TASK=assembleIzzy ;;
            *) echo "::error::unknown variant '$VARIANT'"; exit 1 ;;
          esac
          case "$BUILD_TYPE" in
            release) TASK="${TASK}Release" ;;
            *)       TASK="${TASK}Debug" ;;
          esac
          echo "Building $TASK as $PKG"
          ./gradlew --console=plain "$TASK" --warning-mode summary

      - name: Sign release APK
        if: ${{ github.event.inputs.buildType == 'release' && secrets.KEYSTORE != '' }}
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ github.event.inputs.variant || 'foss' }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: metrolist-dynamic-island-${{ github.event.inputs.variant || 'foss' }}-${{ github.event.inputs.buildType || 'debug' }}
          path: app/build/outputs/apk/*/*/*.apk
          if-no-files-found: error